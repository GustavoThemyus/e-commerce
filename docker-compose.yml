services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      # Rodam só na primeira subida, enquanto o volume está vazio, em ordem alfabética
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./backend/migrations/001_rbac.sql:/docker-entrypoint-initdb.d/002_rbac.sql:ro
      - ./backend/migrations/002_sale_items.sql:/docker-entrypoint-initdb.d/003_sale_items.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
